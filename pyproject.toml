[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compensated-anarchist"
version = "0.2.0"
description = "Compensated Anarchist - agentic harness for Defensive Cyber Operations (hunt, triage, forensics, response) with MCP connectors, ROE enforcement, multi-agent experts and learning memory."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pyyaml>=6",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.7"]
velociraptor = ["pyvelociraptor", "grpcio"]
forensics = ["yara-python", "volatility3", "flare-capa", "flare-floss", "memprocfs",
             "sigma-cli", "pysigma-backend-splunk", "pysigma-backend-elasticsearch", "pysigma-backend-kusto",
             "pysigma-pipeline-sysmon", "pysigma-pipeline-windows"]
connectors = ["compensated-anarchist[anthropic,velociraptor]"]
all = ["compensated-anarchist[anthropic,velociraptor,forensics]"]
dev = ["pytest>=8"]

[project.scripts]
canarchist = "compensated_anarchist.cli:main"

[tool.setuptools.packages.find]
include = ["compensated_anarchist*"]

[tool.setuptools.package-data]
compensated_anarchist = ["prompts/*.md", "playbooks/*.md", "experts/*.md", "web/static/*", "builtin_skills/*/LICENSE-*", "builtin_skills/*/*/SKILL.md"]

[tool.pytest.ini_options]
# Only the project's own tests. Never collect from case, evidence or data folders: agents write code there (the
# code writer's test files), and collecting a test file imports it, which runs its top-level code.
testpaths = ["tests"]
norecursedirs = ["cases", "forensics", "evidence", "data", "memory", "run", "tool_specs", "reports", "config", ".venv", ".git", "*.egg-info"]
